services:
  db:
    image: postgres:16-alpine
    container_name: agrocrm_db
    environment:
      POSTGRES_USER: agro_user
      POSTGRES_PASSWORD: agro_password
      POSTGRES_DB: agrocrm
    ports:
      - "5432:5432"
    volumes:
      - agro_postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: agrocrm_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@agro.com
      PGADMIN_DEFAULT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - db

  redis:
    image: redis:7-alpine
    container_name: agro_crm_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  agro_postgres_data:
  redis_data: